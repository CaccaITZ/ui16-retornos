name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Allow local HTTP/WebSocket to Ui16
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          XML
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace("<application ", '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" ', 1)
          if "android.permission.INTERNET" not in s:
              s = s.replace("</manifest>", '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
          p.write_text(s)
          PY
      - name: Build debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee ../gradle-build.log
          code=${PIPESTATUS[0]}
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ui16-Retornos-Build-Log
          path: gradle-build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ui16-Retornos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
